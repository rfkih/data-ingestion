# Project name - controls container/volume prefixes.
# With name=blackheart, the volumes below become blackheart_pgdata and
# blackheart_redisdata, matching the volumes already created during earlier
# manual `docker run` commands. Existing data is preserved.
name: blackheart

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: blackheart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: trading_db
    ports:
      - "5432:5432"
    volumes:
      # timescale/timescaledb-ha:pg16 uses /home/postgres/pgdata/data as PGDATA,
      # not /var/lib/postgresql/data like the official postgres image. The volume
      # MUST mount at this path or the image will run a fresh initdb into its
      # internal PGDATA and ignore the restored data.
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: blackheart-redis
    restart: unless-stopped
    # Durability: AOF (everysec fsync) + RDB snapshots.
    # - AOF gives at-most-1s data loss on power-cut; rewrite at 100% growth or 64MB.
    # - RDB snapshot every 5min if >=10 keys changed; gives a fast point-in-time
    #   restore (dump.rdb) backed up alongside the Postgres dump. Without RDB the
    #   only recovery artifact is the AOF stream, which is slow to replay on
    #   startup for large key spaces.
    #
    # Memory cap: 2GB hard ceiling with allkeys-lru eviction. Without these,
    # Redis defaults to maxmemory-policy=noeviction — once full, every write
    # returns OOM and the trading JVM crashes mid-tick on the next cache.put().
    # allkeys-lru is safe here because every key already has a TTL (transient
    # cache + pub/sub); evicting the coldest of those on memory pressure is
    # the right failure mode. If you find live state is being evicted, the
    # fix is to move it to Postgres, not to remove the cap.
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?set in .env}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--auto-aof-rewrite-percentage"
      - "100"
      - "--auto-aof-rewrite-min-size"
      - "64mb"
      - "--save"
      - "300 10"
      - "--save"
      - "60 10000"
      - "--stop-writes-on-bgsave-error"
      - "yes"
      - "--maxmemory"
      - "2gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # KAFKA — runs externally (VPS docker or home docker); NOT defined here
  # to allow docker-compose to work both on VPS (where kafka already exists)
  # and on dev machine (where kafka may run separately). Services reference
  # kafka:9092 which resolves via Docker DNS if kafka is in this compose,
  # or is unreachable on dev (use native kafka or docker run separately).

  # Trading JVM (BlackheartApplication, @Profile("!research"))
  # Live Binance WebSocket, schedulers, live trading endpoints.
  #
  # We use the legacy `bootJar` (no exclusions) here, NOT `tradingBootJar`.
  # The exclusion list in tradingBootJar used to be buggy (dropped
  # ResearchControlService which @Profile("!research") code depends on);
  # that was fixed (2026-05-22) by carving out ResearchControlService.
  # We still ship legacy bootJar via compose because the resulting image
  # is the same shape and we lose nothing — switch to tradingBootJar only
  # if the artifact-size reduction starts mattering.
  blackheart:
    build:
      context: ./blackheart-trading-engine
      dockerfile: Dockerfile
      args:
        JAR_FILE: build/libs/blackheart-0.0.1-SNAPSHOT.jar
    container_name: blackheart-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      blackheartjs:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/trading_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Redis auth: set REDIS_PASSWORD in /c/Project/.env so the JVM sends
      # AUTH on connection. Empty value disables AUTH (matches the
      # application.properties default).
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Real JWT signing key — passed from /c/Project/.env so it isn't
      # baked into the image and isn't the well-known dev default that
      # Spring warns about on startup.
      JWT_SECRET: ${JWT_SECRET:?set in /c/Project/.env}
      SERVER_PORT: "8080"
      JAVA_OPTS: "-Xms512m -Xmx1500m"
      NODEJS_URL: http://blackheartjs:8088
      KAFKA_BOOTSTRAP_SERVERS: blackheart-kafka:9092
      # Binance WS proxy — same shape as VPS, but the home compose names
      # the gateway `blackheartjs`. Without this override the JVM falls
      # back to application-dev.properties' stale trycloudflare URL.
      APP_LIVE_BINANCE_WS_BASE: ws://blackheartjs:8088
      # Binance REST proxy — home ISP DNS-hijacks api.binance.com, so we
      # can't reach Binance from this network even via the local gateway.
      # Route through the VPS gateway over tailnet instead — VPS has a
      # clean network path to Binance and its gateway exposes the same
      # transparent /api/v3/* proxy. ~17ms tailnet RTT added per backfill
      # call, acceptable for non-hot-path use.
      # Falls back to direct Binance if the override is missing, so dev
      # against a non-blocked network still works.
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-http://100.112.13.126:8088}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?set in /c/Project/.env}
      # ResearchProxyController defaults to 127.0.0.1:8081 (correct when both
      # JVMs run natively on the same host). Inside docker, 127.0.0.1 is the
      # container itself — must point at the research service by compose DNS.
      RESEARCH_BASE_URL: http://blackheart-research:8081
      # Research orchestrator (FastAPI :8082) stays on the host machine —
      # reach it via the docker host-gateway alias declared in extra_hosts.
      RESEARCH_ORCH_BASE_URL: http://host.docker.internal:8082
      # Shared secret for the server-side X-Orch-Token header. Must match
      # ORCH_AUTH_TOKEN in blackheart-research-orchestrator/.env.
      RESEARCH_ORCH_TOKEN: ${RESEARCH_ORCH_TOKEN:?set in /c/Project/.env}
      # Browser origins allowed to hit the API. localhost:3000 covers the
      # host-machine browser; the Tailscale Funnel URL covers external access
      # via the VPS proxy (https://middleware.tailbf9662.ts.net → Caddy
      # on VPS → tailnet → this home stack). No port suffix — Funnel is port 443
      # (standard HTTPS) so the browser Origin header omits the port. Add domains
      # here as deployment surfaces grow.
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://100.112.13.126:3000,https://middleware.tailbf9662.ts.net
      WS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://100.112.13.126:3000,https://middleware.tailbf9662.ts.net
    extra_hosts:
      # Lets the trading container reach services still running natively on
      # the host (research-orchestrator :8082, inference, ingest, train).
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  # Research JVM (BlackheartResearchApplication, @Profile("research"))
  # Backtest, monte-carlo, sweep, and historical-backfill endpoints.
  # No live Binance WS, no schedulers - safe to restart without affecting trading.
  blackheart-research:
    build:
      context: ./blackheart-trading-engine
      dockerfile: Dockerfile
      args:
        JAR_FILE: build/libs/blackheart-research-0.0.1-SNAPSHOT.jar
    container_name: blackheart-research
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      blackheartjs:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev,research
      DB_URL: jdbc:postgresql://postgres:5432/trading_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?set in /c/Project/.env}
      SERVER_PORT: "8081"
      JAVA_OPTS: "-Xms512m -Xmx1500m"
      NODEJS_URL: http://blackheartjs:8088
      KAFKA_BOOTSTRAP_SERVERS: blackheart-kafka:9092
      # application-research.properties pins server.address=127.0.0.1 ("internal
      # only behind a proxy"). That makes the JVM unreachable from the compose
      # network and the host port mapping. Override to bind all interfaces.
      RESEARCH_BIND_ADDRESS: "0.0.0.0"
      RESEARCH_ORCH_BASE_URL: http://host.docker.internal:8082
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?set in /c/Project/.env}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://100.112.13.126:3000
    extra_hosts:
      # Reach inference/ingest/train running natively on the host.
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"

  blackheartjs:
    build:
      context: ./blackheart-exchange-gateway
      dockerfile: Dockerfile
    container_name: blackheart-js
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8088"
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  blackridge:
    build:
      context: ./blackridge-frontend
      # Home uses the hybrid Dockerfile (deps in container, .next built on
      # host by manage.ps1) because the in-container `next build` can't
      # reach Google Fonts from this network. CI uses the self-contained
      # Dockerfile in the same repo (works on GitHub Actions runners).
      dockerfile: Dockerfile.host
      args:
        # NEXT_PUBLIC_* are inlined into the bundle at build time, so the
        # browser uses these URLs regardless of where the container runs.
        # Override via shell/.env to point at a different host:
        #   FRONTEND_API_URL=https://middleware.tailbf9662.ts.net docker compose build blackridge
        # WS default uses wss:// (Funnel → Caddy → JVM). Caddy proxies /ws*
        # to the trading JVM at port 8080 with WebSocket upgrade headers.
        # Browsers block ws:// from HTTPS pages (mixed content), so this
        # must stay wss:// for the Funnel-served deployment.
        # For direct local access (http://100.112.13.126:3000) set:
        #   FRONTEND_WS_URL=ws://100.112.13.126:8080/ws docker compose build blackridge
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://100.112.13.126:8080}
        NEXT_PUBLIC_RESEARCH_URL: ${FRONTEND_API_URL:-http://100.112.13.126:8080}
        NEXT_PUBLIC_WS_URL: ${FRONTEND_WS_URL:-wss://middleware.tailbf9662.ts.net/ws}
    container_name: blackheart-frontend
    restart: unless-stopped
    depends_on:
      - blackheart
      - blackheart-research
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://100.112.13.126:8080}
      NEXT_PUBLIC_RESEARCH_URL: ${FRONTEND_API_URL:-http://100.112.13.126:8080}
      NEXT_PUBLIC_WS_URL: ${FRONTEND_WS_URL:-wss://middleware.tailbf9662.ts.net/ws}
    ports:
      - "3000:3000"

  # Read-only WAL streaming replica of the VPS prod Postgres. Receives
  # changes over Tailscale from 100.112.13.126:5432 via the replication
  # slot `home_standby_slot`. Recovery mode is enabled automatically by
  # the standby.signal file that pg_basebackup -R wrote into the volume.
  #
  # Bound to port 5433 (not 5432) so the existing dev postgres (which
  # the home trading/research JVMs write to) stays untouched. Connect
  # for ad-hoc read queries:
  #   psql -h localhost -p 5433 -U postgres -d trading_db
  #
  # POSTGRES_PASSWORD is NOT validated here — the data dir was bootstrapped
  # via pg_basebackup, which preserves the primary's pg_authid. The
  # primary's POSTGRES_PASSWORD is what works against this standby.
  postgres-standby:
    image: timescale/timescaledb-ha:pg16
    container_name: blackheart-postgres-standby
    restart: unless-stopped
    # Recovery-only: skip POSTGRES_PASSWORD / POSTGRES_DB env (the entrypoint
    # would re-init otherwise). Set POSTGRES_INITDB_SKIP=true alternative
    # would also work, but the simplest tell is: data dir is pre-populated,
    # entrypoint detects this and skips init.
    environment:
      # Required so pg_isready / entrypoint doesn't try to init.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      # The pgdata_standby volume was filled by pg_basebackup from the
      # primary. The standby.signal file in there puts postgres into
      # recovery / streaming mode on start.
      - pgdata_standby:/home/postgres/pgdata/data
    ports:
      # 5433 is taken on this host by cashier-postgres; use 5434.
      - "127.0.0.1:5434:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 1500m

  # ─────────────────────────────────────────────────────────────────────
  # Observability stack (Stage 1a of live monitoring)
  # ─────────────────────────────────────────────────────────────────────
  # VictoriaMetrics — Prometheus-compatible TSDB. Scrapes /actuator/prometheus
  # on the trading + research JVMs (via host.docker.internal so it works
  # whether the JVMs are run natively on the host or inside this compose
  # network). Single binary, ~50MB RAM at idle. Bound to 127.0.0.1 only —
  # not internet-reachable.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    container_name: blackheart-victoriametrics
    restart: unless-stopped
    command:
      - "-storageDataPath=/storage"
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
      - "-retentionPeriod=90d"
      - "-httpListenAddr=:8428"
    volumes:
      # Home mounts the .dev.yml — every metric scraped here is tagged
      # with env=dev, host=home-a8 so a shared Grafana can split prod/dev.
      # See VPS compose for the prod counterpart.
      - ./monitoring/victoriametrics/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - vmdata:/storage
    ports:
      - "127.0.0.1:8428:8428"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Postgres-exporter — same shape as the VPS compose; the home postgres
  # gets its own connection-pool / lock / table-size metrics. Scraped via
  # the compose-network DNS name `postgres-exporter` from the
  # victoriametrics service.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: blackheart-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/trading_db?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    ports:
      - "127.0.0.1:9187:9187"
    mem_limit: 64m

  # Grafana — dashboards over VictoriaMetrics. Default admin password is
  # `admin`; change on first login. Bound to 127.0.0.1:3001 (3000 is taken
  # by Blackridge). Provisioning auto-wires VictoriaMetrics as the default
  # datasource — no manual setup needed on first boot.
  grafana:
    image: grafana/grafana:11.3.1
    container_name: blackheart-grafana
    restart: unless-stopped
    depends_on:
      victoriametrics:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

  # Loki — log aggregation backend, same shape as VPS compose.
  loki:
    image: grafana/loki:3.2.1
    container_name: blackheart-loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    mem_limit: 256m

  # Promtail — log shipper. Uses promtail.dev.yml so logs are tagged
  # env=dev, host=home-a8.
  promtail:
    image: grafana/promtail:3.2.1
    container_name: blackheart-promtail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ./monitoring/promtail/promtail.dev.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/tmp/positions
    mem_limit: 128m

  # ─────────────────────────────────────────────────────────────────────
  # ML Feature Stream Processor (event-driven pipeline)
  # ─────────────────────────────────────────────────────────────────────
  blackheart-ingest:
    build:
      context: ./blackheart-ingest
      dockerfile: Dockerfile
    container_name: blackheart-ingest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INGEST_PROFILE: prod
      INGEST_DB_DSN: postgresql://blackheart_research:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/trading_db
      KAFKA_BOOTSTRAP_SERVERS: blackheart-kafka:9092
      PYTHONUNBUFFERED: "1"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────
  # ML Inference Sidecar (event-driven pipeline)
  # ─────────────────────────────────────────────────────────────────────
  blackheart-inference:
    build:
      context: ./blackheart-inference
      dockerfile: Dockerfile
    container_name: blackheart-inference
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      blackheart-ingest:
        condition: service_healthy
    environment:
      INFERENCE_PROFILE: prod
      INFERENCE_HOST: "0.0.0.0"
      INFERENCE_PORT: "8000"
      INFERENCE_AUTH_TOKEN: ${INFERENCE_AUTH_TOKEN:?set in .env}
      INFERENCE_DB_DSN: postgresql://blackheart_research:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/trading_db
      INFERENCE_ARTIFACT_DIR: /artifacts
      INFERENCE_STREAMING_ENABLED: "true"
      INFERENCE_STREAMING_POLL_SECONDS: "60"
      INFERENCE_STREAMING_MAX_GAP_HOURS: "24"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Mount model artifacts directory (created by blackheart-train)
      - ./blackheart-train/artifacts:/artifacts:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  kafkadata:
  vmdata:
  grafanadata:
  lokidata:
  promtail-positions:
  # Streaming replica of VPS prod — created out-of-band by pg_basebackup,
  # then mounted into postgres-standby. `external: true` so docker
  # compose doesn't try to recreate it on every up; the volume name
  # `pgdata_standby` must match what pg_basebackup wrote to.
  pgdata_standby:
    external: true
