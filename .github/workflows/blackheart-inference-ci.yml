name: Inference CI/CD
# Event-driven ML pipeline - uses docker run (not docker-compose) for VPS deployment

on:
  push:
    branches: [master, main]
    paths:
      - 'blackheart-inference/**'
      - '!blackheart-inference/**/*.md'   # docs-only changes don't trigger a deploy
      - '.github/workflows/blackheart-inference-ci.yml'
  pull_request:
    paths:
      - 'blackheart-inference/**'
      - '!blackheart-inference/**/*.md'
  workflow_dispatch:

concurrency:
  group: inference-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  deployments: write

env:
  REGISTRY: ghcr.io
  # Repo-scoped package name (rfkih/data-ingestion/blackheart-inference):
  # the legacy user-level rfkih/blackheart-inference package was created
  # by the retired rfkih/inference repo's Actions, so THIS repo's
  # GITHUB_TOKEN gets permission_denied: write_package on it. A package
  # first created by this workflow is automatically writable here.
  IMAGE_INFERENCE: ${{ github.repository }}/blackheart-inference

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "blackheart-inference/pyproject.toml"

      - name: Install (with dev extras)
        working-directory: blackheart-inference
        run: pip install ".[dev]"

      - name: Run tests
        working-directory: blackheart-inference
        # Strict — a failing suite must block the image build and deploy.
        # (Was `|| true`, which let any breakage ship to the VPS.)
        run: pytest -q

  build-image:
    name: Build + push GHCR image
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Compute tag (short SHA)
        id: tag
        run: echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0 (Node 24)

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0 (Node 24)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push inference image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0 (Node 24)
        with:
          context: ./blackheart-inference
          file: ./blackheart-inference/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_INFERENCE }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_INFERENCE }}:latest
          push: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max

  deploy-inference:
    name: Deploy inference to VPS (docker)
    needs: build-image
    # Manual dispatch must NOT bypass the DEPLOY_ENABLED gate (ingest L9 parity).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-vps
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ vars.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_HOST=${SSH_HOST}" >> "$GITHUB_ENV"
          SSH_USER=$(printf '%s' "${{ vars.VPS_USER }}" | tr -d '[:space:]')
          echo "SSH_USER=${SSH_USER}" >> "$GITHUB_ENV"

      - name: Capture rollback image
        run: |
          # FULL image ref, not just the tag: the pre-CI container ran a
          # locally-built image; a ghcr.io re-prefix would be unpullable.
          PREV=$(ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "docker inspect blackheart-inference --format '{{.Config.Image}}' 2>/dev/null || echo NONE")
          echo "PREV_IMAGE=${PREV:-NONE}" >> "$GITHUB_ENV"
          echo "Previous inference image: ${PREV}"

      - name: Pin new tag in /home/starsky/blackheart/.env
        env:
          NEW_TAG: ${{ needs.build-image.outputs.sha_tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "set -e && touch /home/starsky/blackheart/.env && grep -vE '^(INFERENCE_TAG|INFERENCE_IMAGE)=' /home/starsky/blackheart/.env > /tmp/.env.inf || true && echo 'INFERENCE_TAG=${NEW_TAG}' >> /tmp/.env.inf && mv /tmp/.env.inf /home/starsky/blackheart/.env"
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"

      - name: Pull + recreate inference container
        run: |
          # Pull BEFORE rm (the rm-first ordering caused the 53-min ingest
          # outage on 2026-06-12). Secrets live in the host-side
          # /home/starsky/blackheart/inference.env (mode 600), NOT inline -
          # the previous version committed the prod auth token and DB
          # password to the repo. Loopback-only publish matches the live
          # secured binding; container-network consumers use the service
          # name. Artifacts path is /home/starsky/blackheart-artifacts (the
          # old blackheart-train/artifacts path was wrong - empty dir).
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "docker pull ghcr.io/${{ env.IMAGE_INFERENCE }}:${NEW_TAG} && \
             { docker rm -f blackheart-inference 2>/dev/null || true; \
               docker run -d --name blackheart-inference --restart unless-stopped \
                 --network blackheart_default \
                 -p 127.0.0.1:8000:8000 \
                 --stop-timeout 60 \
                 -v /home/starsky/blackheart-artifacts:/artifacts:ro \
                 --env-file /home/starsky/blackheart/inference.env \
                 ghcr.io/${{ env.IMAGE_INFERENCE }}:${NEW_TAG}; }"

      - name: Inference healthcheck (with rollback on failure)
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            'for i in $(seq 1 12); do curl -fsS http://127.0.0.1:8000/readyz >/dev/null && exit 0; sleep 10; done; exit 1'
          HEALTH=$?
          set -e
          if [ "$HEALTH" -ne 0 ]; then
            echo "::error::Inference healthcheck failed. Rolling back to ${PREV_IMAGE}."
            if [ "${PREV_IMAGE}" != "NONE" ]; then
              ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
                "docker rm -f blackheart-inference && docker run -d --name blackheart-inference --restart unless-stopped \
                 --network blackheart_default \
                 -p 127.0.0.1:8000:8000 \
                 --stop-timeout 60 \
                 -v /home/starsky/blackheart-artifacts:/artifacts:ro \
                 --env-file /home/starsky/blackheart/inference.env \
                 ${PREV_IMAGE}"
            fi
            exit 1
          fi
          echo "Inference deploy ${NEW_TAG} healthy."

      - name: Verify ML artifacts present on VPS
        run: |
          COUNT=$(ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "find /home/starsky/blackheart-artifacts -name '*.pkl' 2>/dev/null | wc -l")
          echo "VPS artifact count: ${COUNT}"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::Artifact directory on VPS is empty — inference will 502 on every backfill call."
            echo "::error::Run scripts/sync-artifacts.ps1 from the home machine then re-deploy."
            exit 1
          fi

      - name: Prune stale Docker images
        if: success()
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "docker image prune -af 2>&1 | tail -1"

      - name: Tag successful production deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy/prod/inference-${GITHUB_SHA::8}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${GITHUB_SHA}" \
            > /dev/null && echo "Tagged ${TAG}" || echo "::warning::Tag ${TAG} may already exist (non-fatal)"
