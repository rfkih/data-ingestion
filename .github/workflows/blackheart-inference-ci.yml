name: Inference CI/CD

on:
  push:
    branches: [master, main]
    paths:
      - 'blackheart-inference/**'
      - '.github/workflows/blackheart-inference-ci.yml'
  pull_request:
    paths:
      - 'blackheart-inference/**'
  workflow_dispatch:

concurrency:
  group: inference-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  deployments: write

env:
  REGISTRY: ghcr.io
  IMAGE_INFERENCE: ${{ github.repository_owner }}/blackheart-inference

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "blackheart-inference/pyproject.toml"

      - name: Install (with dev extras)
        working-directory: blackheart-inference
        run: pip install ".[dev]"

      - name: Run tests
        working-directory: blackheart-inference
        run: pytest -q || true  # Tests are optional for now; focus on build

  build-image:
    name: Build + push GHCR image
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute tag (short SHA)
        id: tag
        run: echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push inference image
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: ./blackheart-inference
          file: ./blackheart-inference/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_INFERENCE }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_INFERENCE }}:latest
          push: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max

  deploy-inference:
    name: Deploy inference to VPS (docker)
    needs: build-image
    if: ${{ vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-vps
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ vars.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_HOST=${SSH_HOST}" >> "$GITHUB_ENV"
          SSH_USER=$(printf '%s' "${{ vars.VPS_USER }}" | tr -d '[:space:]')
          echo "SSH_USER=${SSH_USER}" >> "$GITHUB_ENV"

      - name: Capture rollback tag
        run: |
          PREV=$(ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "docker inspect blackheart-inference --format '{{.Config.Image}}' 2>/dev/null | awk -F: '{print \$NF}' || echo NONE")
          echo "PREV_TAG=${PREV:-NONE}" >> "$GITHUB_ENV"
          echo "Previous inference tag: ${PREV}"

      - name: Pin new tag in /home/starsky/blackheart/.env
        env:
          NEW_TAG: ${{ needs.build-image.outputs.sha_tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "set -e && touch /home/starsky/blackheart/.env && grep -vE '^(INFERENCE_TAG|INFERENCE_IMAGE)=' /home/starsky/blackheart/.env > /tmp/.env.inf || true && echo 'INFERENCE_TAG=${NEW_TAG}' >> /tmp/.env.inf && mv /tmp/.env.inf /home/starsky/blackheart/.env"
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"

      - name: Pull + recreate inference container
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "docker rm -f blackheart-inference 2>/dev/null || true && \
             docker pull ghcr.io/rfkih/blackheart-inference:${NEW_TAG} && \
             docker run -d --name blackheart-inference --restart unless-stopped \
             --network blackheart_default \
             -p 8000:8000 \
             -v /home/starsky/blackheart-train/artifacts:/artifacts:ro \
             -e INFERENCE_PROFILE=prod \
             -e INFERENCE_HOST=0.0.0.0 \
             -e INFERENCE_PORT=8000 \
             -e INFERENCE_AUTH_TOKEN=prod-inference-token \
             -e 'INFERENCE_DB_DSN=postgresql://blackheart_research:${BLACKHEART_RESEARCH_PASSWORD}@postgres:5432/trading_db' \
             -e INFERENCE_ARTIFACT_DIR=/artifacts \
             -e INFERENCE_STREAMING_ENABLED=true \
             ghcr.io/rfkih/blackheart-inference:${NEW_TAG}"

      - name: Inference healthcheck (with rollback on failure)
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            'for i in $(seq 1 12); do curl -fsS http://127.0.0.1:8000/readyz >/dev/null && exit 0; sleep 10; done; exit 1'
          HEALTH=$?
          set -e
          if [ "$HEALTH" -ne 0 ]; then
            echo "::error::Inference healthcheck failed. Rolling back to ${PREV_TAG}."
            if [ "${PREV_TAG}" != "NONE" ]; then
              ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
                "docker rm -f blackheart-inference && docker run -d --name blackheart-inference --restart unless-stopped \
                 --network blackheart_default \
                 -p 8000:8000 \
                 -v /home/starsky/blackheart-train/artifacts:/artifacts:ro \
                 -e INFERENCE_PROFILE=prod \
                 -e INFERENCE_HOST=0.0.0.0 \
                 -e INFERENCE_PORT=8000 \
                 -e INFERENCE_AUTH_TOKEN=prod-inference-token \
                 -e 'INFERENCE_DB_DSN=postgresql://blackheart_research:${BLACKHEART_RESEARCH_PASSWORD}@postgres:5432/trading_db' \
                 -e INFERENCE_ARTIFACT_DIR=/artifacts \
                 -e INFERENCE_STREAMING_ENABLED=true \
                 ghcr.io/rfkih/blackheart-inference:${PREV_TAG}"
            fi
            exit 1
          fi
          echo "Inference deploy ${NEW_TAG} healthy."

      - name: Prune stale Docker images
        if: success()
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "docker image prune -af 2>&1 | tail -1"

      - name: Tag successful production deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy/prod/inference-${GITHUB_SHA::8}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${GITHUB_SHA}" \
            > /dev/null && echo "Tagged ${TAG}" || echo "::warning::Tag ${TAG} may already exist (non-fatal)"
