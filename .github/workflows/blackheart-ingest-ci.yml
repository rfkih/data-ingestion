name: Ingest CI/CD
# Event-driven ML pipeline - uses docker run (not docker-compose) for VPS deployment

on:
  push:
    branches: [master, main]
    paths:
      - 'blackheart-ingest/**'
      - '.github/workflows/blackheart-ingest-ci.yml'
  pull_request:
    paths:
      - 'blackheart-ingest/**'
  workflow_dispatch:

concurrency:
  group: ingest-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  deployments: write

env:
  REGISTRY: ghcr.io
  IMAGE_INGEST: ${{ github.repository_owner }}/blackheart-ingest

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "blackheart-ingest/pyproject.toml"

      - name: Install (with dev + kafka extras)
        working-directory: blackheart-ingest
        run: pip install ".[dev,kafka]"

      - name: Run tests
        working-directory: blackheart-ingest
        run: pytest -q --ignore=tests/test_inference.py --ignore=tests/test_train_ingest_equivalence.py

      # H8 (CODE_REVIEW_INGEST_2026-06-12): boot the SERVED app
      # (workers.server:app) WITH its lifespan so a broken lifespan import /
      # route table fails CI - the old suite only exercised the dead api/
      # app, which is how 'CI green, served app broken' kept happening.
      - name: Smoke-boot served app (lifespan)
        working-directory: blackheart-ingest
        run: pytest -q tests/test_server_app.py

  build-image:
    name: Build + push GHCR image
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute tag (short SHA)
        id: tag
        run: echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ingest image
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: ./blackheart-ingest
          file: ./blackheart-ingest/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_INGEST }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_INGEST }}:latest
          push: true
          cache-from: type=gha,scope=ingest
          cache-to: type=gha,scope=ingest,mode=max

  deploy-ingest:
    name: Deploy ingest to VPS (docker)
    needs: build-image
    # L9 fix: manual dispatch used to BYPASS the DEPLOY_ENABLED gate.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-vps
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ vars.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_HOST=${SSH_HOST}" >> "$GITHUB_ENV"
          SSH_USER=$(printf '%s' "${{ vars.VPS_USER }}" | tr -d '[:space:]')
          echo "SSH_USER=${SSH_USER}" >> "$GITHUB_ENV"

      - name: Capture rollback tag
        run: |
          PREV=$(ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "docker inspect blackheart-ingest --format '{{.Config.Image}}' 2>/dev/null | awk -F: '{print \$NF}' || echo NONE")
          echo "PREV_TAG=${PREV:-NONE}" >> "$GITHUB_ENV"
          echo "Previous ingest tag: ${PREV}"

      - name: Pin new tag in /home/starsky/blackheart/.env
        env:
          NEW_TAG: ${{ needs.build-image.outputs.sha_tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "set -e && touch /home/starsky/blackheart/.env && grep -vE '^(INGEST_TAG|INGEST_IMAGE)=' /home/starsky/blackheart/.env > /tmp/.env.ing || true && echo 'INGEST_TAG=${NEW_TAG}' >> /tmp/.env.ing && mv /tmp/.env.ing /home/starsky/blackheart/.env"
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"

      - name: Pull + recreate ingest container
        run: |
          # Pull BEFORE rm: a failed pull must not leave the host with no
          # container (a transient containerd error on 2026-06-12 removed the
          # old container then failed the pull -> 53-min ingest outage + lost
          # unbackfillable liquidation events). Pull first, then swap.
          # Bind publish to loopback + Tailscale ONLY: 0.0.0.0 exposed the
          # unauthenticated /pull + /compute mutation endpoints to the public
          # internet (CODE_REVIEW_INGEST_2026-06-12 C1). VPS-local consumers
          # (orchestrator, trading JVM) reach it by container name over the
          # docker network; the home box reaches it over Tailscale.
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "docker pull ghcr.io/rfkih/blackheart-ingest:${NEW_TAG} && \
             { docker rm -f blackheart-ingest 2>/dev/null || true; \
               docker run -d --name blackheart-ingest --restart unless-stopped \
                 --network blackheart_default \
                 -p 127.0.0.1:8001:8001 \
                 -p 100.112.13.126:8001:8001 \
                 --stop-timeout 120 \
                 --env-file /home/starsky/blackheart/ingest.env \
                 ghcr.io/rfkih/blackheart-ingest:${NEW_TAG}; }"

      - name: Ingest healthcheck (with rollback on failure)
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            'for i in $(seq 1 12); do curl -fsS http://127.0.0.1:8001/health >/dev/null && exit 0; sleep 10; done; exit 1'
          HEALTH=$?
          set -e
          if [ "$HEALTH" -ne 0 ]; then
            echo "::error::Ingest healthcheck failed. Rolling back to ${PREV_TAG}."
            if [ "${PREV_TAG}" != "NONE" ]; then
              ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
                "docker rm -f blackheart-ingest && docker run -d --name blackheart-ingest --restart unless-stopped \
                 --network blackheart_default \
                 -p 127.0.0.1:8001:8001 \
                 -p 100.112.13.126:8001:8001 \
                 --stop-timeout 120 \
                 --env-file /home/starsky/blackheart/ingest.env \
                 ghcr.io/rfkih/blackheart-ingest:${PREV_TAG}"
            fi
            exit 1
          fi
          echo "Ingest deploy ${NEW_TAG} healthy."

      - name: Prune stale Docker images
        if: success()
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "docker image prune -af 2>&1 | tail -1"

      - name: Tag successful production deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy/prod/ingest-${GITHUB_SHA::8}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${GITHUB_SHA}" \
            > /dev/null && echo "Tagged ${TAG}" || echo "::warning::Tag ${TAG} may already exist (non-fatal)"
