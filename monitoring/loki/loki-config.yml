# Loki — single-binary mode. Suitable for this scale (one host per env,
# < 10 GB of logs/month at current verbosity). Move to microservices mode
# only when ingestion rate exceeds ~30 MB/s.
#
# Storage: filesystem on a named docker volume. Retention 30 days via the
# compactor (loki keeps chunks but the compactor enforces TTL).
#
# No auth — Loki is bound to 127.0.0.1 only via the compose port mapping,
# Grafana reaches it on the docker bridge by service name.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# TSDB schema — recommended index format for Loki 2.9+. v13 is the current
# stable. Period 24h means a new index file per day, easier to rotate.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-active
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

# Limits — keep ingestion bounded so a runaway log loop can't fill disk.
limits_config:
  retention_period: 720h          # 30 days
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  max_query_length: 721h
  max_query_parallelism: 32
  # Per-stream rate guard. A noisy container won't drown others on disk.
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

# Compactor — runs periodically to apply retention_period and dedupe.
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  compaction_interval: 10m

# Disable alertmanager hookup — we use vmalert (or none, currently) for that.
ruler:
  enable_api: false
  storage:
    type: local
    local:
      directory: /loki/rules

# Analytics phone-home — off. Don't ping grafana.com from prod.
analytics:
  reporting_enabled: false
